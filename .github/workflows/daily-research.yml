name: Daily research snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-research.yml"
      - "config/**"
      - "src/**"
      - "poetry.lock"
      - "pyproject.toml"
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry install --only main --sync
      - run: poetry run swing-trader daily
      - uses: actions/upload-artifact@v4
        with:
          name: swing-trader-${{ github.run_id }}
          path: |
            data/raw/prices.manifest.json
            data/raw/data_quality.json
            reports/latest/
            reports/shadow/
          if-no-files-found: error
          retention-days: 90
