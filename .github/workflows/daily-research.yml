name: Daily research snapshot

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      integrity_passed: ${{ steps.integrity.outputs.passed }}
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: shadow-evidence
          path: durable-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry install --only main --sync
      - name: Restore weekly free-tier reconciliation cache
        run: |
          mkdir -p data/raw
          cp durable-evidence/evidence/provider-cache/alpha_vantage_monthly.parquet data/raw/alpha_vantage_monthly.parquet 2>/dev/null || true
          cp durable-evidence/evidence/provider-cache/alpha_vantage_monthly.manifest.json data/raw/alpha_vantage_monthly.manifest.json 2>/dev/null || true
      - run: poetry run swing-trader daily
      - name: Score matured prospective decisions
        run: poetry run swing-trader shadow evaluate --records durable-evidence/evidence/records
      - name: Audit artifact integrity
        id: integrity
        run: |
          poetry run swing-trader audit
          echo "passed=true" >> "$GITHUB_OUTPUT"
      - name: Enforce decision data gate
        run: poetry run swing-trader audit --require-data-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-trader-${{ github.run_id }}
          path: |
            data/raw/prices.manifest.json
            data/raw/data_quality.json
            data/raw/alpha_vantage_monthly.parquet
            data/raw/alpha_vantage_monthly.manifest.json
            reports/latest/
            reports/shadow/
          if-no-files-found: error
          retention-days: 90

  archive-shadow:
    needs: snapshot
    if: ${{ always() && needs.snapshot.outputs.integrity_passed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow-evidence
          path: archive
      - uses: actions/download-artifact@v4
        with:
          name: swing-trader-${{ github.run_id }}
          path: staging
      - name: Append immutable shadow record
        run: |
          mkdir -p archive/evidence/records
          mkdir -p archive/evidence/evaluations
          mkdir -p archive/evidence/provider-cache
          cp staging/reports/shadow/*.json archive/evidence/records/
          cp staging/reports/latest/prospective_evaluation.json archive/evidence/evaluations/${{ github.run_id }}.json
          cp staging/data/raw/alpha_vantage_monthly.parquet archive/evidence/provider-cache/ 2>/dev/null || true
          cp staging/data/raw/alpha_vantage_monthly.manifest.json archive/evidence/provider-cache/ 2>/dev/null || true
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add evidence/records evidence/evaluations evidence/provider-cache
          if git -C archive diff --cached --quiet; then
            echo "Record already archived."
            exit 0
          fi
          git -C archive commit -m "Archive shadow record ${{ github.run_id }}"
          git -C archive push origin HEAD:shadow-evidence
