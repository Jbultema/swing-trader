name: No-paid stock shadow

on:
  schedule:
    - cron: "30 0 * * 2-6"
  workflow_dispatch:

concurrency:
  group: stock-shadow
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: shadow-evidence
          path: durable-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry install --only main --sync
      - name: Advance immutable stock shadow
        run: poetry run swing-trader stock-daily --archive-root durable-evidence/evidence/stock-shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-shadow-${{ github.run_id }}
          path: |
            data/stock-shadow/universe/*.manifest.json
            data/stock-shadow/prices/*.manifest.json
            data/stock-shadow/provider-quota/
            reports/stock-shadow/lineages/
          if-no-files-found: error
          retention-days: 90

  archive:
    needs: snapshot
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow-evidence
          path: archive
      - uses: actions/download-artifact@v4
        with:
          name: stock-shadow-${{ github.run_id }}
          path: staging
      - name: Append immutable stock evidence
        run: |
          mkdir -p archive/evidence/stock-shadow/lineages
          cp -R staging/reports/stock-shadow/lineages/. archive/evidence/stock-shadow/lineages/
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add evidence/stock-shadow
          if git -C archive diff --cached --quiet; then
            echo "Stock evidence already archived."
            exit 0
          fi
          git -C archive commit -m "Archive stock shadow ${{ github.run_id }}"
          git -C archive push origin HEAD:shadow-evidence
