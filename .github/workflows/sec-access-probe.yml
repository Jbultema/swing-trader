name: SEC public-data access diagnostic

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: swing-trader/0.1 research contact https://github.com/Jbultema/swing-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry install --only main --sync
      - name: Probe official keyless SEC submissions endpoint
        id: submissions
        continue-on-error: true
        run: >-
          poetry run swing-trader data probe-sec-access
          --cik 0000320193
          --ticker AAPL
          --output reports/sec-access-probe.json
      - name: Probe official SEC fallback endpoints
        if: always()
        continue-on-error: true
        run: |
          curl --silent --show-error --location --max-time 30 \
            --user-agent "$SEC_USER_AGENT" --output /dev/null \
            --write-out "latest-filings-rss http=%{http_code}\n" \
            "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&output=atom&count=10" \
            > reports/sec-official-fallback-probe.txt
          curl --silent --show-error --location --max-time 30 \
            --user-agent "$SEC_USER_AGENT" --output /dev/null \
            --write-out "daily-master-index http=%{http_code}\n" \
            "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR4/master.20261006.idx" \
            >> reports/sec-official-fallback-probe.txt
          curl --silent --show-error --location --head --max-time 30 \
            --user-agent "$SEC_USER_AGENT" --output /dev/null \
            --write-out "nightly-submissions-bulk http=%{http_code}\n" \
            "https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip" \
            >> reports/sec-official-fallback-probe.txt
          cat reports/sec-official-fallback-probe.txt
      - name: Classify direct endpoint result
        if: always()
        run: |
          if [[ ! -f reports/sec-access-probe.json ]]; then
            echo "::error title=SEC probe implementation failed::The structured probe report was not created."
            exit 1
          fi
          status="$(jq -er '.status | select(. == "passed" or . == "failed")' reports/sec-access-probe.json)" || {
            echo "::error title=SEC probe report malformed::The structured probe status is missing or invalid."
            exit 1
          }
          if [[ "$status" == "failed" ]]; then
            echo "::warning title=SEC public endpoint unavailable::This optional diagnostic is not a trading input; inspect the retained probe artifact for provider detail."
            {
              echo "## SEC public-data access diagnostic"
              echo
              echo "- Direct endpoint: **unavailable**"
              echo "- Classification: optional external-network diagnostic; no trading action authorized"
              echo "- Detail: retained in the structured probe artifact"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-access-probe-${{ github.run_id }}
          path: |
            reports/sec-access-probe.json
            reports/sec-official-fallback-probe.txt
          if-no-files-found: warn
          retention-days: 90
