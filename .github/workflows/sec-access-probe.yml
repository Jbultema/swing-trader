name: SEC public-data access probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec-access-probe.yml"
      - "src/swing_trader/sec_filing_events.py"
      - "src/swing_trader/cli.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: swing-trader/0.1 research contact https://github.com/Jbultema/swing-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry install --only main --sync
      - name: Probe official keyless SEC submissions endpoint
        run: >-
          poetry run swing-trader data probe-sec-access
          --cik 0000320193
          --ticker AAPL
          --output reports/sec-access-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-access-probe-${{ github.run_id }}
          path: reports/sec-access-probe.json
          if-no-files-found: error
          retention-days: 90
