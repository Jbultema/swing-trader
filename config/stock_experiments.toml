[universe]
name = "sp500_point_in_time"
membership_floor = "2005-01-03"
minimum_price = 10.0
minimum_median_dollar_volume = 20000000.0
include_delisted = true

[execution]
signal_at = "regular_session_close"
execute_at = "next_regular_session_open"
round_trip_cost_bps = [20, 50, 100]
maximum_positions = 10
maximum_position_weight = 0.10

[signals]
families = ["short_volume", "smooth_momentum", "volume_breakout"]
formation_days = 252
skip_days = 21
holding_sessions = [5, 10, 21, 42, 63]

[exits]
families = ["rank_decay", "trend_break", "atr_trailing", "time_stop", "combined"]
hard_stop_fraction = 0.08
atr_multiples = [2.5, 3.0, 3.5]
rank_exit_multiple = 2.0
maximum_holding_sessions = 63

[validation]
selection_end = "2016-12-30"
validation_start = "2017-01-03"
validation_end = "2021-12-31"
sealed_test_start = "2022-01-03"
primary_metric = "median_walk_forward_net_excess_return"
required_comparators = ["spy", "equal_weight_universe", "classic_12_1_momentum"]
